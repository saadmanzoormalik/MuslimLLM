  - name: ISLAMIC_HISTORY_AND_CIVILIZATION
    authoritative: true
    stable: true
    metadata: [period, geography, source_type, primary_or_secondary, author, publication_date, authority_tier, dataset_version]
  - name: MODERN_MUSLIM_WORLD
    authoritative: true
    stable: true
    metadata: [geography, source_type, author, publication_date, authority_tier, dataset_version]
  - name: GENERAL_SCIENCE_AND_ACADEMIC
