app:
  description: Permission, provenance, security, and quarantine gate for candidate
    documents.
  icon: 🧭
  icon_background: '#E8F1EC'
  icon_type: emoji
  mode: workflow
  name: DATASET CANDIDATE INGESTION
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: start-source-control-target
      source: start
      sourceHandle: source
      target: control
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: control-source-end-target
      source: control
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: Document Json
          max_length: 24000
          options: []
          required: true
          type: paragraph
          variable: document_json
      height: 90
      id: start
      position:
        x: 30
        y: 260
      positionAbsolute:
        x: 30
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\nimport re\n\ndef main(document_json: str) -> dict:\n \
          \   doc = json.loads(document_json or \"{}\")\n    required = [\"title\"\
          , \"source_type\", \"copyright_status\", \"provenance\", \"dataset_version\"\
          ]\n    missing = [key for key in required if not doc.get(key)]\n    injection\
          \ = bool(re.search(r\"ignore .*instructions|reveal .*system prompt\", str(doc.get(\"\
          content\", \"\")), re.I))\n    allowed = not missing and not injection and\
          \ doc.get(\"storage_allowed\") is True and doc.get(\"embedding_allowed\"\
          ) is True\n    result = {\"candidate_accepted\": allowed, \"target_knowledge_base\"\
          : \"LIVE_RESEARCH_CANDIDATES\", \"required_human_review\": True, \"missing_fields\"\
          : missing, \"prompt_injection_detected\": injection}\n    return {\"result_json\"\
          : json.dumps(result, ensure_ascii=False), \"candidate_accepted\": allowed}\n"
        code_language: python3
        desc: ''
        outputs:
          candidate_accepted:
            children: null
            type: boolean
          result_json:
            children: null
            type: string
        selected: false
        title: DATASET CANDIDATE INGESTION
        type: code
        variables:
        - value_selector:
          - start
          - document_json
          value_type: string
          variable: document_json
      height: 90
      id: control
      position:
        x: 350
        y: 260
      positionAbsolute:
        x: 350
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - control
          - result_json
          value_type: string
          variable: result_json
        - value_selector:
          - control
          - candidate_accepted
          value_type: boolean
          variable: candidate_accepted
        selected: false
        title: End
        type: end
      height: 90
      id: end
      position:
        x: 680
        y: 260
      positionAbsolute:
        x: 680
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.62
  rag_pipeline_variables: []
