    - data:
        code: "import json\nimport re\n\ndef main(query: str, current_information_allowed:\
          \ str = \"true\") -> dict:\n    text = re.sub(r\"\\s+\", \" \", query.lower()).strip()\n\
          \    def has(*terms): return any(term in text for term in terms)\n    categories\
          \ = []\n    mapping = {\n        \"scientific\": (\"science\", \"scientific\"\
          , \"photosynthesis\", \"physics\", \"biology\", \"chemistry\"),\n      \
          \  \"technical\": (\"python\", \"code\", \"algorithm\", \"api\", \"database\"\
          , \"engineering\"),\n        \"medical\": (\"medical\", \"disease\", \"\
          treatment\", \"symptom\", \"medicine\"),\n        \"professional\": (\"\
          sale\", \"business\", \"workplace\", \"client\", \"customer\"),\n      \
          \  \"ethical\": (\"lie\", \"deceive\", \"honest\", \"fair\", \"ethic\",\
          \ \"harm\"),\n        \"Qur'an\": (\"quran\", \"qur'an\", \"ayah\", \"surah\"\
          ),\n        \"Hadith\": (\"hadith\", \"sunnah\", \"bukhari\"),\n       \
          \ \"fiqh\": (\"fiqh\", \"fatwa\", \"madhab\", \"rak'ah\", \"rak‘ah\", \"\
          traveler\", \"halal\", \"haram\"),\n        \"history\": (\"history\", \"\
          ottoman\", \"abbasid\", \"umayyad\", \"empire\"),\n        \"Muslim civilization\"\
          : (\"muslim world\", \"civilization\", \"caliphate\", \"trade route\"),\n\
          \        \"geopolitics\": (\"geopolit\", \"war\", \"government\", \"foreign\
          \ policy\"),\n        \"current affairs\": (\"today\", \"this week\", \"\
          current\", \"latest\", \"news\"),\n    }\n    for category, terms in mapping.items():\n\
          \        if has(*terms): categories.append(category)\n    if not categories:\
          \ categories = [\"general\"]\n    s = set(categories)\n    fiqh = \"fiqh\"\
          \ in s\n    science = bool(s & {\"scientific\", \"technical\", \"medical\"\
          })\n    history = bool(s & {\"history\", \"Muslim civilization\", \"geopolitics\"\
          })\n    current = current_information_allowed.lower() == \"true\" and \"\
          current affairs\" in s\n    values = bool(s & {\"professional\", \"ethical\"\
          })\n    mode = \"fiqh\" if fiqh else \"current_geopolitics\" if current\
          \ and \"geopolitics\" in s else \"history_and_civilization\" if history\
          \ else \"scientific_or_technical\" if science else \"islamic_knowledge\"\
          \ if s & {\"Qur'an\", \"Hadith\"} else \"values_sensitive\" if values else\
          \ \"general\"\n    citation = fiqh or history or current or \"Hadith\" in\
          \ s or \"Qur'an\" in s or \"medical\" in s\n    count = 3 if current else\
          \ 2 if fiqh or history or \"medical\" in s else 1 if science or citation\
          \ else 0\n    policy = {\n        \"categories\": categories, \"answer_mode\"\
          : mode, \"values_sensitive\": values,\n        \"quran_required\": \"Qur'an\"\
          \ in s, \"hadith_required\": \"Hadith\" in s,\n        \"fiqh_sensitive\"\
          : fiqh, \"madhab_sensitive\": fiqh and has(\"madhab\", \"traveler\", \"\
          rak'ah\", \"rak‘ah\"),\n        \"scientific_sources_required\": science,\
          \ \"historical_sources_required\": history,\n        \"current_sources_required\"\
          : current, \"minimum_source_tier\": 3 if citation else 2 if science else\
          \ 0,\n        \"minimum_source_count\": count, \"source_diversity_required\"\
          : current or fiqh,\n        \"citation_required\": citation, \"scholar_consultation_may_be_needed\"\
          : fiqh or \"medical\" in s,\n        \"risk_level\": \"high\" if \"medical\"\
          \ in s else \"medium\" if fiqh or current else \"low\"\n    }\n    return\
          \ {\"policy_json\": json.dumps(policy, ensure_ascii=False), \"answer_mode\"\
          : mode, \"risk_level\": policy[\"risk_level\"]}\n"
        code_language: python3
        desc: ''
        outputs:
          answer_mode:
            children: null
            type: string
          policy_json:
            children: null
            type: string
          risk_level:
            children: null
