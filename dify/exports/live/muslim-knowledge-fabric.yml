    - data:
        code: "import json, re, uuid\ndef main(query: str) -> dict:\n    original\
          \ = query\n    clean = re.sub(r\"\\s+\", \" \", query).strip()\n    flags\
          \ = []\n    if re.search(r\"ignore .*instructions|reveal .*system prompt|override\
          \ .*policy|developer instructions\", clean, re.I):\n        flags.append(\"\
          prompt_injection\")\n    valid = bool(clean) and len(clean) <= 24000\n \
          \   payload = {\"query_id\": str(uuid.uuid4()), \"original_query\": original,\
          \ \"clean_query\": clean[:24000], \"security_flags\": flags, \"valid\":\
          \ valid, \"rejection_reason\": \"\" if valid else \"invalid_query\"}\n \
          \   return {\"validation_json\": json.dumps(payload, ensure_ascii=False),\
          \ \"clean_query\": payload[\"clean_query\"], \"valid\": valid, \"security_flags_json\"\
          : json.dumps(flags)}\n"
        code_language: python3
        desc: ''
        outputs:
          clean_query:
            children: null
            type: string
          security_flags_json:
            children: null
            type: string
          valid:
            children: null
            type: boolean
          validation_json:
            children: null
            type: string
        selected: false
