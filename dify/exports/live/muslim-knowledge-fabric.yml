          \   clean = re.sub(r\"^```(?:json)?|```$\", \"\", raw, flags=re.I).strip()\n\
          \        parsed = json.loads(clean)\n        if not isinstance(parsed, dict)\
          \ or not parsed.get(\"draft_answer\"):\n            raise ValueError(\"\
          missing draft_answer\")\n    except Exception:\n        parsed = {\"draft_answer\"\
          : raw, \"claims\": [], \"uncertainties\": [\"model_output_normalized\"],\
          \ \"proposed_citations\": []}\n    parsed.setdefault(\"claims\", [])\n \
