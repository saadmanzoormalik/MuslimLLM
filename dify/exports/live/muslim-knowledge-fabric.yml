          ) and not parsed[\"proposed_citations\"]:\n        source_ids = [source.get(\"\
          source_id\") for source in evidence.get(\"sources\", []) if source.get(\"\
          source_id\")]\n        parsed[\"proposed_citations\"] = source_ids[:max(1,\
          \ int(policy.get(\"minimum_source_count\", 1)))]\n        for claim in parsed[\"\
          claims\"]:\n            if isinstance(claim, dict) and not claim.get(\"\
          supporting_source_ids\"):\n                claim[\"supporting_source_ids\"\
          ] = list(parsed[\"proposed_citations\"])\n    return {\"draft_json\": json.dumps(parsed,\
          \ ensure_ascii=False), \"draft_answer\": parsed.get(\"draft_answer\", \"\
          \")}\n"
