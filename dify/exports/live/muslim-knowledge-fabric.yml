    - data:
        code: "import json, re\ndef main(policy_json: str, evidence_json: str, islamic:\
          \ str, fiqh: str, science: str, history: str, values: str) -> dict:\n  \
          \  policy = json.loads(policy_json)\n    evidence = json.loads(evidence_json\
          \ or \"{}\")\n    source_ids = {source.get(\"source_id\") for source in\
          \ evidence.get(\"sources\", []) if source.get(\"source_id\")}\n    relevant\
          \ = []\n    if policy.get(\"quran_required\") or policy.get(\"hadith_required\"\
          ) or policy.get(\"fiqh_sensitive\"): relevant.append((\"islamic_source\"\
          , islamic))\n    if policy.get(\"fiqh_sensitive\"): relevant.append((\"\
          fiqh_madhab\", fiqh))\n    if policy.get(\"scientific_sources_required\"\
          ): relevant.append((\"scientific_accuracy\", science))\n    if policy.get(\"\
          historical_sources_required\"): relevant.append((\"historical_geopolitical\"\
          , history))\n    if policy.get(\"values_sensitive\"): relevant.append((\"\
          islamic_values\", values))\n    parsed, failures = [], []\n    for name,\
          \ raw in relevant:\n        try:\n            clean = re.sub(r\"^```(?:json)?|```$\"\
          , \"\", (raw or \"\").strip(), flags=re.I).strip()\n            item = json.loads(clean)\n\
          \            hard_fields = {\n                \"islamic_source\": (\"verse_mapping_failures\"\
          , \"hadith_metadata_failures\", \"false_consensus_claims\", \"required_revisions\"\
          ),\n                \"fiqh_madhab\": (\"madhab_issues\", \"required_revisions\"\
          ),\n                \"scientific_accuracy\": (\"factual_errors\", \"outdated_claims\"\
          , \"causation_errors\", \"required_revisions\"),\n                \"historical_geopolitical\"\
          : (\"chronology_errors\", \"fact_analysis_confusion\", \"romanticization_or_propaganda\"\
          , \"required_revisions\"),\n                \"islamic_values\": (\"alignment_issues\"\
          , \"scientific_facts_changed\", \"required_revisions\"),\n            }[name]\n\
          \            hard_failures = [field for field in hard_fields if item.get(field)]\n\
          \            if name == \"islamic_source\":\n                unsupported\
          \ = item.get(\"unsupported_islam_says_claims\") or []\n                unknown_support\
          \ = [\n                    issue for issue in unsupported\n            \
          \        if not issue.get(\"supporting_source_ids\")\n                 \
          \   or any(source_id not in source_ids for source_id in issue.get(\"supporting_source_ids\"\
          , []))\n                ]\n                if unknown_support:\n       \
          \             hard_failures.append(\"unsupported_islam_says_claims\")\n\
          \            if name == \"fiqh_madhab\" and item.get(\"fatwa_impersonation\"\
          ):\n                hard_failures.append(\"fatwa_impersonation\")\n    \
          \        normalized_passed = item.get(\"passed\") is True or not hard_failures\n\
          \            parsed.append({\"reviewer\": name, \"result\": item, \"normalized_passed\"\
          : normalized_passed, \"hard_failures\": hard_failures})\n            if\
          \ not normalized_passed: failures.append(name)\n        except Exception:\
          \ failures.append(name + \":invalid_json\")\n    return {\"reviewer_outputs_json\"\
          : json.dumps(parsed, ensure_ascii=False), \"review_failures_json\": json.dumps(failures),\
          \ \"reviews_passed\": not failures}\n"
