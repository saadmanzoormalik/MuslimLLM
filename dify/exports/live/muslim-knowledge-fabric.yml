    - data:
        code: "import json\ndef main(quran, hadith, tafsir, fiqh, history, modern,\
          \ science) -> dict:\n    sources = []\n    for kb, records in [\n      \
          \  (\"QURAN_VERIFIED\", quran), (\"HADITH_VERIFIED\", hadith),\n       \
          \ (\"TAFSIR_AND_CLASSICAL_SCHOLARSHIP\", tafsir), (\"FIQH_AND_USUL\", fiqh),\n\
          \        (\"ISLAMIC_HISTORY_AND_CIVILIZATION\", history), (\"MODERN_MUSLIM_WORLD\"\
          , modern),\n        (\"GENERAL_SCIENCE_AND_ACADEMIC\", science),\n    ]:\n\
          \        for index, record in enumerate(records or []):\n            metadata\
          \ = dict(record.get(\"metadata\") or {})\n            metadata.update(metadata.get(\"\
