          - finalcheck
          - verification_json
          value_type: string
          variable: verification_json
        - value_selector:
          - finalcheck
          - passed
          value_type: boolean
          variable: passed
        selected: false
        title: End
        type: end
      height: 90
      id: end
      position:
        x: 1270
        y: 260
      positionAbsolute:
        x: 1270
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
