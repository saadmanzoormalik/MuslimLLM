          - text
          value_type: string
          variable: semantic_json
      height: 90
      id: finalcheck
      position:
        x: 960
        y: 260
      positionAbsolute:
        x: 960
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
