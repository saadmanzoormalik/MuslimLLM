app:
  description: Authority, metadata, quarantine, and prompt-injection filtering for
    retrieved sources.
  icon: 🧭
  icon_background: '#E8F1EC'
  icon_type: emoji
  mode: workflow
  name: GOVERNED RETRIEVAL
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: start-source-control-target
      source: start
      sourceHandle: source
      target: control
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: control-source-end-target
      source: control
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: Policy Json
          max_length: 24000
          options: []
          required: true
          type: paragraph
          variable: policy_json
        - label: Retrieval Jobs Json
          max_length: 24000
          options: []
          required: true
          type: paragraph
          variable: retrieval_jobs_json
        - label: Sources Json
          max_length: 24000
          options: []
          required: false
          type: paragraph
          variable: sources_json
      height: 90
      id: start
      position:
        x: 30
        y: 260
      positionAbsolute:
        x: 30
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\ndef main(policy_json: str, retrieval_jobs_json: str,\
          \ sources_json: str = \"[]\") -> dict:\n    policy = json.loads(policy_json\
          \ or \"{}\")\n    jobs = {j[\"knowledge_base\"]: j for j in json.loads(retrieval_jobs_json\
          \ or \"[]\")}\n    accepted, rejected = [], []\n    for source in json.loads(sources_json\
          \ or \"[]\"):\n        sid, kb = source.get(\"source_id\", \"unknown\"),\
          \ source.get(\"knowledge_base\", \"\")\n        meta = source.get(\"metadata\"\
          ) or {}\n        reason = None\n        if kb not in jobs: reason = \"unplanned_knowledge_base\"\
          \n        elif source.get(\"disabled\"): reason = \"source_disabled\"\n\
          \        elif source.get(\"prompt_injection_detected\"): reason = \"prompt_injection\"\
          \n        elif source.get(\"quarantined\") and kb != \"LIVE_RESEARCH_CANDIDATES\"\
          : reason = \"quarantined\"\n        elif not meta.get(\"dataset_version\"\
          ): reason = \"missing_dataset_version\"\n        elif int(source.get(\"\
          authority_tier\", 0)) < int(jobs[kb].get(\"minimum_authority_tier\", 0)):\
          \ reason = \"authority_tier\"\n        if reason: rejected.append(f\"{sid}:{reason}\"\
          )\n        else: accepted.append(source)\n    minimum = int(policy.get(\"\
          minimum_source_count\", 0))\n    required = {k for k, j in jobs.items()\
          \ if j.get(\"required\", True)}\n    covered = {s.get(\"knowledge_base\"\
          ) for s in accepted}\n    enough = len(accepted) >= minimum and required.issubset(covered)\n\
          \    confidence = \"high\" if enough and len(accepted) >= max(2, minimum)\
          \ else \"medium\" if enough else \"insufficient\"\n    pack = {\"sources\"\
          : accepted, \"coverage_score\": 1.0 if enough else 0.0, \"conflicts\": [],\
          \ \"evidence_confidence\": confidence, \"rejection_reasons\": rejected}\n\
          \    return {\"evidence_json\": json.dumps(pack, ensure_ascii=False), \"\
          evidence_confidence\": confidence, \"source_count\": len(accepted)}\n"
        code_language: python3
        desc: ''
        outputs:
          evidence_confidence:
            children: null
            type: string
          evidence_json:
            children: null
            type: string
          source_count:
            children: null
            type: number
        selected: false
        title: GOVERNED RETRIEVAL
        type: code
        variables:
        - value_selector:
          - start
          - policy_json
          value_type: string
          variable: policy_json
        - value_selector:
          - start
          - retrieval_jobs_json
          value_type: string
          variable: retrieval_jobs_json
        - value_selector:
          - start
          - sources_json
          value_type: string
          variable: sources_json
      height: 90
      id: control
      position:
        x: 350
        y: 260
      positionAbsolute:
        x: 350
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - control
          - evidence_json
          value_type: string
          variable: evidence_json
        - value_selector:
          - control
          - evidence_confidence
          value_type: string
          variable: evidence_confidence
        - value_selector:
          - control
          - source_count
          value_type: number
          variable: source_count
        selected: false
        title: End
        type: end
      height: 90
      id: end
      position:
        x: 680
        y: 260
      positionAbsolute:
        x: 680
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.62
  rag_pipeline_variables: []
