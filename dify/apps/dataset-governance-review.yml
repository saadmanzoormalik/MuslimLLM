app:
  description: Human-governed promotion from candidate quarantine to a stable knowledge base.
  icon: 🧭
  icon_background: '#E8F1EC'
  mode: workflow
  name: DATASET GOVERNANCE REVIEW
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: start-source-control-target
      source: start
      sourceHandle: source
      target: control
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: control-source-end-target
      source: control
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: Candidate Json
          max_length: 24000
          options: []
          required: true
          type: paragraph
          variable: candidate_json
        - label: Human Approved
          max_length: null
          options:
          - 'false'
          - 'true'
          required: true
          type: select
          variable: human_approved
          default: 'false'
      height: 90
      id: start
      position:
        x: 30
        y: 260
      positionAbsolute:
        x: 30
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: DATASET GOVERNANCE REVIEW
        type: code
        code_language: python3
        code: "import json\n\ndef main(candidate_json: str, human_approved: str = \"false\") -> dict:\n    item = json.loads(candidate_json\
          \ or \"{}\")\n    required = [\"source_registered\", \"indexing_allowed\", \"storage_allowed\", \"embedding_allowed\"\
          , \"provenance_complete\", \"copyright_status\", \"authority_tier\", \"security_scan_passed\"]\n    failed = [key\
          \ for key in required if not item.get(key)]\n    sensitive = item.get(\"source_type\") in [\"Quran\", \"Hadith\"\
          , \"Fiqh\", \"Medical\", \"Legal\"] or item.get(\"major_historical_controversy\") is True\n    approved = not failed\
          \ and human_approved.lower() == \"true\"\n    result = {\"approved_for_stable_dataset\": approved, \"required_human_review\"\
          : sensitive or not approved, \"target_knowledge_base\": item.get(\"proposed_knowledge_base\", \"\") if approved\
          \ else \"\", \"rejection_reasons\": failed if failed else ([] if approved else [\"human_approval_required\"])}\n\
          \    return {\"result_json\": json.dumps(result, ensure_ascii=False), \"approved\": approved}\n"
        variables:
        - variable: candidate_json
          value_selector:
          - start
          - candidate_json
          value_type: string
        - variable: human_approved
          value_selector:
          - start
          - human_approved
          value_type: string
        outputs:
          result_json:
            children: null
            type: string
          approved:
            children: null
            type: boolean
      height: 90
      id: control
      position:
        x: 350
        y: 260
      positionAbsolute:
        x: 350
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: End
        type: end
        outputs:
        - variable: result_json
          value_selector:
          - control
          - result_json
          value_type: string
        - variable: approved
          value_selector:
          - control
          - approved
          value_type: boolean
      height: 90
      id: end
      position:
        x: 680
        y: 260
      positionAbsolute:
        x: 680
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.62
