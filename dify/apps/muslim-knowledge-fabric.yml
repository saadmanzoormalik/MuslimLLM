    - data:
        desc: ''
        selected: false
        title: Retrieval Plan
        type: code
        code_language: python3
        code: "import json\n\ndef main(policy_json: str) -> dict:\n    p = json.loads(policy_json)\n    jobs = []\n    def\
          \ add(kb, top_k, required=True, live=False):\n        if kb not in [j[\"knowledge_base\"] for j in jobs]:\n    \
          \        jobs.append({\"knowledge_base\": kb, \"top_k\": top_k, \"required\": required, \"live\": live, \"minimum_authority_tier\"\
          : p.get(\"minimum_source_tier\", 0)})\n    if p.get(\"quran_required\"): add(\"QURAN_VERIFIED\", 5)\n    if p.get(\"\
          hadith_required\"): add(\"HADITH_VERIFIED\", 8)\n    if p.get(\"fiqh_sensitive\"):\n        add(\"FIQH_AND_USUL\"\
          , 8); add(\"QURAN_VERIFIED\", 5, False); add(\"HADITH_VERIFIED\", 8, False)\n    if p.get(\"historical_sources_required\"\
          ): add(\"ISLAMIC_HISTORY_AND_CIVILIZATION\", 8)\n    if p.get(\"scientific_sources_required\"): add(\"GENERAL_SCIENCE_AND_ACADEMIC\"\
          , 8)\n    if p.get(\"current_sources_required\"):\n        add(\"MODERN_MUSLIM_WORLD\", 8); add(\"LIVE_RESEARCH_CANDIDATES\"\
          , 8, True, True)\n    return {\"retrieval_jobs_json\": json.dumps(jobs), \"retrieval_required\": bool(jobs)}\n"
        variables:
        - variable: policy_json
          value_selector:
          - classify
          - policy_json
          value_type: string
        outputs:
          retrieval_jobs_json:
            children: null
            type: string
          retrieval_required:
            children: null
            type: boolean
      height: 90
