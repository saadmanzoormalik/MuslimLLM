        type: code
        code_language: python3
        code: "import json\ndef main(policy_json: str, retrieval_jobs_json: str) -> dict:\n    p, jobs = json.loads(policy_json),\
          \ json.loads(retrieval_jobs_json)\n    pack = {\"sources\": [], \"coverage_score\": 0, \"conflicts\": [], \"evidence_confidence\"\
          : \"insufficient\" if p.get(\"minimum_source_count\", 0) else \"high\", \"rejection_reasons\": [\"runtime_knowledge_base_bindings_required\"\
          ] if jobs else []}\n    return {\"evidence_json\": json.dumps(pack), \"confidence\": pack[\"evidence_confidence\"\
          ]}\n"
        variables:
        - variable: policy_json
