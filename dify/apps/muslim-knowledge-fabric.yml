          value_selector:
          - validate
          - clean_query
          value_type: string
        - variable: draft_json
          value_selector:
          - verify
          - draft_json
          value_type: string
        - variable: verification_json
          value_selector:
          - verify
          - verification_json
          value_type: string
        vision:
          enabled: false
