        x: 30
        y: 260
      positionAbsolute:
        x: 30
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: Input Validation
        type: code
        code_language: python3
        code: "import json\nimport re\nimport uuid\n\ndef main(query: str) -> dict:\n    original = query\n    clean = re.sub(r\"\
          \\s+\", \" \", query).strip()\n    patterns = [r\"ignore .*instructions\", r\"reveal .*system prompt\", r\"override\
          \ .*policy\", r\"developer instructions\"]\n    flags = [\"prompt_injection\"] if any(re.search(p, clean, re.I)\
          \ for p in patterns) else []\n    valid = bool(clean) and len(clean) <= 24000\n    reason = \"\" if valid else \"\
          empty_query\" if not clean else \"query_too_long\"\n    result = {\"query_id\": str(uuid.uuid4()), \"original_query\"\
          : original, \"clean_query\": clean[:24000], \"security_flags\": flags, \"valid\": valid, \"rejection_reason\": reason}\n\
          \    return {\"validation_json\": json.dumps(result, ensure_ascii=False), \"clean_query\": result[\"clean_query\"\
          ], \"valid\": valid, \"security_flags_json\": json.dumps(flags)}\n"
        variables:
        - variable: query
          value_selector:
          - start
          - query
          value_type: string
        outputs:
          validation_json:
            children: null
            type: string
          clean_query:
            children: null
            type: string
          valid:
            children: null
            type: boolean
          security_flags_json:
            children: null
            type: string
      height: 90
      id: validate
      position:
        x: 340
        y: 260
      positionAbsolute:
        x: 340
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: Query Policy Classifier
        type: code
        code_language: python3
        code: "import json\nimport re\n\ndef main(query: str, current_information_allowed: str = \"true\") -> dict:\n    text\
          \ = re.sub(r\"\\s+\", \" \", query.lower()).strip()\n    def has(*terms): return any(term in text for term in terms)\n\
          \    categories = []\n    mapping = {\n        \"scientific\": (\"science\", \"scientific\", \"photosynthesis\"\
          , \"physics\", \"biology\", \"chemistry\"),\n        \"technical\": (\"python\", \"code\", \"algorithm\", \"api\"\
          , \"database\", \"engineering\"),\n        \"medical\": (\"medical\", \"disease\", \"treatment\", \"symptom\", \"\
          medicine\"),\n        \"professional\": (\"sale\", \"business\", \"workplace\", \"client\", \"customer\"),\n   \
          \     \"ethical\": (\"lie\", \"deceive\", \"honest\", \"fair\", \"ethic\", \"harm\"),\n        \"Qur'an\": (\"quran\"\
          , \"qur'an\", \"ayah\", \"surah\"),\n        \"Hadith\": (\"hadith\", \"sunnah\", \"bukhari\"),\n        \"fiqh\"\
          : (\"fiqh\", \"fatwa\", \"madhab\", \"rak'ah\", \"rak‘ah\", \"traveler\", \"halal\", \"haram\"),\n        \"history\"\
          : (\"history\", \"ottoman\", \"abbasid\", \"umayyad\", \"empire\"),\n        \"Muslim civilization\": (\"muslim\
          \ world\", \"civilization\", \"caliphate\", \"trade route\"),\n        \"geopolitics\": (\"geopolit\", \"war\",\
          \ \"government\", \"foreign policy\"),\n        \"current affairs\": (\"today\", \"this week\", \"current\", \"\
          latest\", \"news\"),\n    }\n    for category, terms in mapping.items():\n        if has(*terms): categories.append(category)\n\
          \    if not categories: categories = [\"general\"]\n    s = set(categories)\n    fiqh = \"fiqh\" in s\n    science\
          \ = bool(s & {\"scientific\", \"technical\", \"medical\"})\n    history = bool(s & {\"history\", \"Muslim civilization\"\
          , \"geopolitics\"})\n    current = current_information_allowed.lower() == \"true\" and \"current affairs\" in s\n\
          \    values = bool(s & {\"professional\", \"ethical\"})\n    mode = \"fiqh\" if fiqh else \"current_geopolitics\"\
          \ if current and \"geopolitics\" in s else \"history_and_civilization\" if history else \"scientific_or_technical\"\
          \ if science else \"islamic_knowledge\" if s & {\"Qur'an\", \"Hadith\"} else \"values_sensitive\" if values else\
          \ \"general\"\n    citation = fiqh or history or current or \"Hadith\" in s or \"Qur'an\" in s or \"medical\" in\
          \ s\n    count = 3 if current else 2 if fiqh or history or \"medical\" in s else 1 if science or citation else 0\n\
          \    policy = {\n        \"categories\": categories, \"answer_mode\": mode, \"values_sensitive\": values,\n    \
          \    \"quran_required\": \"Qur'an\" in s, \"hadith_required\": \"Hadith\" in s,\n        \"fiqh_sensitive\": fiqh,\
          \ \"madhab_sensitive\": fiqh and has(\"madhab\", \"traveler\", \"rak'ah\", \"rak‘ah\"),\n        \"scientific_sources_required\"\
          : science, \"historical_sources_required\": history,\n        \"current_sources_required\": current, \"minimum_source_tier\"\
          : 3 if citation else 2 if science else 0,\n        \"minimum_source_count\": count, \"source_diversity_required\"\
          : current or fiqh,\n        \"citation_required\": citation, \"scholar_consultation_may_be_needed\": fiqh or \"\
          medical\" in s,\n        \"risk_level\": \"high\" if \"medical\" in s else \"medium\" if fiqh or current else \"\
          low\"\n    }\n    return {\"policy_json\": json.dumps(policy, ensure_ascii=False), \"answer_mode\": mode, \"risk_level\"\
          : policy[\"risk_level\"]}\n"
        variables:
        - variable: query
          value_selector:
          - validate
          - clean_query
          value_type: string
        - variable: current_information_allowed
          value_selector:
          - start
          - current_information_allowed
          value_type: string
        outputs:
          policy_json:
            children: null
            type: string
          answer_mode:
            children: null
            type: string
          risk_level:
            children: null
            type: string
      height: 90
