    - data:
        desc: ''
        selected: false
        title: Citation and Release Gate
        type: code
        code_language: python3
        code: "import json, re\ndef main(draft_json: str, evidence_json: str, policy_json: str) -> dict:\n    try: draft =\
          \ json.loads(re.sub(r\"^```(?:json)?|```$\", \"\", draft_json.strip(), flags=re.I).strip())\n    except Exception:\
          \ draft = {\"draft_answer\": \"\", \"claims\": [], \"proposed_citations\": []}\n    evidence, policy = json.loads(evidence_json),\
          \ json.loads(policy_json)\n    ids = {s.get(\"source_id\") for s in evidence.get(\"sources\", [])}\n    proposed\
          \ = set(draft.get(\"proposed_citations\", []))\n    failures = sorted(x for x in proposed if x not in ids)\n   \
          \ required = int(policy.get(\"minimum_source_count\", 0))\n    unsupported = [] if len(ids) >= required else [\"\
          insufficient_verified_evidence\"]\n    passed = bool(draft.get(\"draft_answer\")) and not failures and not unsupported\n\
          \    result = {\"passed\": passed, \"unsupported_claims\": unsupported, \"citation_failures\": failures, \"religious_source_failures\"\
          : [], \"contradictions\": evidence.get(\"conflicts\", []), \"required_revisions\": []}\n    return {\"draft_json\"\
          : json.dumps(draft, ensure_ascii=False), \"verification_json\": json.dumps(result), \"passed\": passed}\n"
        variables:
        - variable: draft_json
          value_selector:
          - draft
          - text
          value_type: string
        - variable: evidence_json
          value_selector:
          - merge
          - evidence_json
          value_type: string
        - variable: policy_json
          value_selector:
          - classify
          - policy_json
          value_type: string
        outputs:
          draft_json:
            children: null
            type: string
          verification_json:
            children: null
            type: string
          passed:
            children: null
            type: boolean
      height: 90
