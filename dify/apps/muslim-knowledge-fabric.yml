app:
  description: Governed deterministic multi-stage Muslim LLM Chatflow. Draft release remains blocked until runtime KB and
    workflow-tool bindings pass deployment checks.
  icon: 🧭
  icon_background: '#E8F1EC'
  mode: advanced-chat
  name: MUSLIM KNOWLEDGE FABRIC
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
