name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: TestFlight release notes
        required: false
        type: string
      testing_group:
        description: Internal testing group
        default: Internal Testers
        required: false
        type: string
      submit_to_external_testing:
        description: Submit to external testing
        default: false
        required: true
        type: boolean
      increment_build_number:
        description: Use the GitHub run number as the build number
        default: true
        required: true
        type: boolean
      clean_build:
        description: Remove prior build products
        default: true
        required: true
        type: boolean
  push:
    branches:
      - release/testflight
    tags:
      - ios-testflight-*

concurrency:
  group: muslim-llm-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: A532UHKDZC
      BUILD_NUMBER: ${{ github.run_number }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcrun swift --version
          xcodebuild -showsdks

      - name: Install mobile dependencies
        working-directory: mobile
        run: |
          npm ci
          npx cap sync ios

      - name: Install signing credentials
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/muslim-llm.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          API_KEY_DIR="$HOME/private_keys"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          mkdir -p "$API_KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Archive
        run: |
          set -euo pipefail
          if [[ "${{ inputs.clean_build || 'true' }}" == "true" ]]; then
            rm -rf mobile/build
          fi
          xcodebuild \
            -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath mobile/build/MuslimLLM.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Upload to App Store Connect
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath mobile/build/MuslimLLM.xcarchive \
            -exportPath mobile/build/upload \
            -exportOptionsPlist mobile/ios/UploadOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muslim-llm-ios-release-${{ github.run_number }}
          path: |
            mobile/build/MuslimLLM.xcarchive/Info.plist
            mobile/build/upload/DistributionSummary.plist
          if-no-files-found: ignore
          retention-days: 14
